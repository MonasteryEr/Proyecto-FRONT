<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/Proyecto-FRONT/styles/iniciarSesion.css">
    <link rel="icon" type="image/png" href="/Proyecto-FRONT/img/logo.png">
    
    <title>Crear Cuenta - Todo lo que buscas</title>
</head>
<body>

    <header class="logo-container">
        <a href="/Proyecto-FRONT/index.html"> 
            <img src="/Proyecto-FRONT/img/logo.png" alt="Todo lo que buscas" class="logo">
        </a>
    </header>

    <main class="form-container">
        <form class="form" action="#" method="POST">
            <div class="titulo">
                <h2>Crear Cuenta</h2>
                <p class="subtitulo">Regístrate para comenzar a comprar</p>
            </div>

            <div class="nombre">
                <label for="nombre"><i class="fa-solid fa-user"></i> Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="correo">
                <label for="email"><i class="fa-solid fa-envelope"></i> Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="contraseña">
                <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <div class="contraseña-conf">
                <label for="confirm-password"><i class="fa-solid fa-shield"></i> Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" minlength="6" required>
            </div>

            <div class="chapta">
                <input type="checkbox" id="terminos" required>
                <label for="terminos">Acepto los <a href="#">términos y condiciones</a></label>
            </div>

            
            <button type="submit" class="btn-submit">Registrarme</button>

        </form>
            <p class="auth-footer">
            ¿Ya tienes una cuenta? <a href="#">Iniciar sesión</a>
            </p>
    </main>

</body>
</html>
